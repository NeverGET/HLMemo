# HLMemo local stack (PHASE0-SPEC §6, D-004). Everything must pass the gates here before any VPS deploy.
name: hlmemo

x-app-env: &app-env
  HLM_DB_DSN: postgresql://hlm:hlm@db:5432/hlm
  # HLM_ADMIN_TOKEN / HLM_REGISTRATION_SECRET come from .hlm-dev.env (x-env-file below), never
  # from this file: a key listed under `environment` overrides env_file even when unset.
  HLM_PROFILES_DIR: /app/profiles
  HLM_MODELS_DIR: /app/models
  PYTHONUNBUFFERED: "1"

# Local dev secrets (HLM_ADMIN_TOKEN, ...). Gitignored; optional so `docker compose config` works without it.
x-env-file: &env-file
  - path: .hlm-dev.env
    required: false

# Model assets are baked and hash-verified by default: a fresh checkout needs no host models.
# Optional development shortcut: `make models`, set HLM_BAKE_MODELS=0, and explicitly add
# `volumes: ["./models:/app/models:ro"]` to api, worker and test in a Compose override file.
# `/ready` verifies presence + sha256 against models.lock before the api is healthy.

x-build: &build
  context: .
  target: runtime
  args:
    BAKE_MODELS: "${HLM_BAKE_MODELS:-1}"

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17   # verified 2026-09-22 (PHASE0-ASSUMPTIONS-VERIFIED.md row 8a)
    environment:
      POSTGRES_USER: hlm
      POSTGRES_PASSWORD: hlm
      POSTGRES_DB: hlm
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_min_duration_statement=250ms"]
    ports:
      # loopback only (codex review S4): the dev credentials must never be reachable from the LAN —
      # every peer that can open this port bypasses the api's scope checks entirely.
      - "127.0.0.1:${HLM_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hlm -d hlm -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    build: *build
    image: hlmemo:dev
    environment: *app-env
    # `phase0@head` (not bare `head`): the deferred `hnsw` branch is a second head by design
    # (alembic/versions/0002_hnsw.py) and must never be applied automatically.
    command: ["alembic", "upgrade", "phase0@head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *build
    image: hlmemo:dev
    environment: *app-env
    env_file: *env-file
    command: ["python", "-m", "hlmemo.server.app"]
    ports:
      - "${HLM_API_PORT:-8765}:8765"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Readiness, not liveness: /ready is 200 only when the DB is reachable, the migration is at
    # phase0@head and the model files hash to models.lock (server/app.py). /health stays liveness.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/ready', timeout=8).status == 200 else 1)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build: *build
    image: hlmemo:dev
    environment: *app-env
    env_file: *env-file
    command: ["python", "-m", "hlmemo.worker.main"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      <<: *build
      target: test   # runtime image + locked dev deps (pytest) + tests/, see Dockerfile
    image: hlmemo:test
    environment:
      <<: *app-env
      HLM_TEST_DSN: postgresql://hlm:hlm@db:5432/hlm_verify
    env_file: *env-file
    command: ["pytest", "-q", "tests/integration"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
