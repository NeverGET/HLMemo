# Fallback librarian profile (D-019): `openai/gpt-5.6-luna` routed through OpenRouter, so the
# fallback needs no second key; a different upstream provider is the outage hedge.
HLM_LLM_BASE_URL  = "https://openrouter.ai/api/v1"
HLM_LLM_MODEL     = "openai/gpt-5.6-luna"
HLM_LLM_API_KEY   = "env:OPENROUTER_API_KEY"
HLM_LLM_REASONING = '{"effort":"low"}'
extra = { response_format = { type = "json_object" }, temperature = 0, provider = { data_collection = "deny" }, usage = { include = true } }
# USD per 1M tokens (OpenRouter list price 2026-09-23, below the 272k-token tier).
price_in_per_m  = 0.20
price_out_per_m = 1.20
supports_json_schema = false
