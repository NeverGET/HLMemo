# Phase 5 fallback candidate (D-066): `deepseek/deepseek-v4-pro-0813` (pinned snapshot, not the
# unpinned ~deepseek/deepseek-pro-latest alias) routed through OpenRouter. Key from env only.
# bench v2 2026-09-24 (hlm bench, 3 reps, adj-2): reasoning low 95.1% (T9 89.1%, false-warn 0.10),
# p50/p95 9.0/50.7 s, 1.3% final schema fails (thinking hits the task max_tokens); reasoning off 89.7%.
HLM_LLM_BASE_URL  = "https://openrouter.ai/api/v1"
HLM_LLM_MODEL     = "deepseek/deepseek-v4-pro-0813"
HLM_LLM_API_KEY   = "env:OPENROUTER_API_KEY"
HLM_LLM_REASONING = '{"effort":"low"}'
# require_parameters: only endpoints that honour every request field (response_format above all)
# serve the call; 5 of 24 endpoints lack structured_outputs and some ignore temperature/seed.
extra = { response_format = { type = "json_object" }, temperature = 0, provider = { data_collection = "deny", require_parameters = true }, usage = { include = true } }
# USD per 1M tokens. OpenRouter list 2026-09-24: 0.462 / 1.386. Endpoint prices range 0.39-1.65 /
# 1.386-4.95 (DeepSeek first-party has time-of-day peaks of 1.32/3.96): the reservation uses the
# worst response_format-capable endpoint, as the other profiles do; actual cost is settled from usage.
price_in_per_m  = 1.65
price_out_per_m = 4.95
supports_json_schema = false
# Not qualified for the risk judge (D-071): G-LIVE-C 2026-09-24 FAIL, only 11/80 calls fit the 4 s cap
# (false-warn 0.450 from the retrieval-only verdicts); eval/live/2026-09-24-risk-fallback.
disabled_tasks = ["risk_judge"]
