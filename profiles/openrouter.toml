# Default librarian profile (D-019). OpenAI-compatible endpoint; key from env only.
HLM_LLM_BASE_URL  = "https://openrouter.ai/api/v1"
HLM_LLM_MODEL     = "deepseek/deepseek-v4.1-flash"
HLM_LLM_API_KEY   = "env:OPENROUTER_API_KEY"
HLM_LLM_REASONING = '{"enabled":false}'
# OpenRouter-specific request fields live here, never in code (D-017): usage accounting + no retention.
# require_parameters: only endpoints that honour every request field (response_format, temperature)
# serve the call (D-093, consult 63; live 2026-09-24: 200).
extra = { response_format = { type = "json_object" }, temperature = 0, provider = { data_collection = "deny", require_parameters = true }, usage = { include = true } }
# Worst-case reservation prices, USD per 1M tokens (W2a). OpenRouter lists time-of-day pricing for
# this model (2026-09-23: off-peak 0.15/0.60, peak 0.30/1.20): the reservation uses the PEAK price.
price_in_per_m  = 0.30
price_out_per_m = 1.20
# The endpoint advertises structured_outputs, but D-019 benched json_object; switch only after a re-bench.
supports_json_schema = false
# Tasks this model is NOT qualified for (release gates). risk_judge: G-LIVE-C false-warn 0.250 > 0.10
# (eval/live/2026-09-24-risk); memory.risk_check answers retrieval-only while this profile would judge.
disabled_tasks = ["risk_judge"]
