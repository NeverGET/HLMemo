# memory.ask prose WRITER (HLM_RESEARCH_WRITER_PROFILE, D-171/D-178): `z-ai/glm-5` routed through
# OpenRouter to the first-party Z.AI endpoint, Novita as its only backup. Key from env only.
# D-178 (the same 34 end-to-end contexts): 22/25 correct, 0 overloads, median 7.4 s, p95 17 s.
# Earlier (D-175): reasoning ON was 22/25 but p95 31.9-33 s; reasoning OFF 21/25 (within noise),
# median 6.0 s, 0 reasoning tokens; the slow Baidu upstream (21 s median) is no longer routed to.
HLM_LLM_BASE_URL  = "https://openrouter.ai/api/v1"
HLM_LLM_MODEL     = "z-ai/glm-5"
HLM_LLM_API_KEY   = "env:OPENROUTER_API_KEY"
# '{"effort":"low"}' is ignored by this model; '{"enabled": false}' turns reasoning off.
HLM_LLM_REASONING = '{"enabled": false}'
# Z.AI and Novita do not support response_format (so no require_parameters either): without JSON
# mode, 7/34 first tries were invalid JSON (long prose breaks the escaping) and the retries fed the
# tail. json_mode = false makes memory.ask use its plain-text protocol for the prose and expand
# JOBs (research/v3 "prose_text" / "expand_text"). No temperature. The residual latency tail is cut
# by HLM_RESEARCH_WRITER_TIMEOUT_S (fallback to the research profile).
json_mode = false
extra = { provider = { data_collection = "deny", order = ["Z.AI", "Novita"], allow_fallbacks = false }, usage = { include = true } }
# USD per 1M tokens: the Z.AI / Novita list prices (reservation worst case; actual cost is settled
# from usage).
price_in_per_m  = 1.00
price_out_per_m = 3.20
supports_json_schema = false
