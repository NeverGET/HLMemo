# Production defaults; BAKE_* overrides keep local validation isolated.
name: ${BAKE_PROJECT:-${HLM_COMPOSE_PROJECT:-hlmemo-prod}}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# prod.env supplies interpolation only; service secrets are isolated by responsibility.
x-app-env: &app-env
  - path: ${HLM_APP_ENV_FILE:-./app.env}
    required: true

x-app: &app
  image: ${HLM_IMAGE:-hlmemo:prod}
  build:
    context: ..
    dockerfile: Dockerfile
    target: runtime
    labels:
      org.opencontainers.image.revision: ${HLM_IMAGE_REVISION:-local}
    args:
      BAKE_MODELS: "1"
  env_file: *app-env
  environment: &app-environment
    HLM_PROFILES_DIR: /app/profiles
    HLM_MODELS_DIR: /app/models
    HLM_API_HOST: 0.0.0.0
    HLM_API_PORT: "8765"
    PYTHONUNBUFFERED: "1"
    # Disable the native telemetry uploader before ONNX Runtime initializes.
    ORT_DISABLE_TELEMETRY: "1"
    # W0a (D-052, D-061): shipped with the release, never taken from env files. With `production`
    # the API refuses to start (/ready 503 "unsafe config") unless both stay closed/disabled.
    # Devices are minted over SSH: deploy/scripts/hlm_ops.sh device mint ... (RUNBOOK).
    HLM_DEPLOYMENT: production
    HLM_REGISTRATION_MODE: closed
    HLM_ADMIN_HTTP: disabled
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  pids_limit: 256
  networks: [backend, outbound]

services:
  db:
    image: ${HLM_DB_IMAGE:-pgvector/pgvector:0.8.6-pg17}
    env_file:
      - path: ${HLM_DB_ENV_FILE:-./db.env}
        required: true
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
    command: ["postgres", "-c", "timezone=UTC", "-c", "shared_buffers=512MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=128MB", "-c", "max_connections=50"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # No ports, even on loopback. Only the private backend network reaches Postgres.
    networks: [backend]
    restart: unless-stopped
    logging: *logging
    mem_limit: 2g
    cpus: 1.0
    shm_size: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "main@head"]
    restart: "no" # Successful completion IS the one-shot migration's health signal.
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-environment
      HLM_REQUEST_SPOOL_DIR: /var/spool/hlmemo
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/spool/hlmemo:size=320m,uid=10001,gid=10001,mode=0700
    # R2: the same optional llm.env as the librarian (last, so it wins over app.env's HLM_PROFILE).
    # The api runs the memory.risk_check judge and enqueues librarian jobs only when it enables them.
    env_file:
      - path: ${HLM_APP_ENV_FILE:-./app.env}
        required: true
      - path: ${HLM_API_ENV_FILE:-./api.env}
        required: true
      - path: ${HLM_LLM_ENV_FILE:-./llm.env}
        required: false
    command: ["python", "-m", "hlmemo.server.app"]
    # Cold cgroup peak 1536 MiB + spool 320 MiB + /tmp 64 MiB, with 25% headroom.
    mem_limit: 2560m
    cpus: 1.0
    networks:
      backend: {}
      frontend:
        aliases: [api-frontend]
      outbound: {}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/ready', timeout=8).read()"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 90s

  worker:
    <<: *app
    environment:
      <<: *app-environment
      HLM_EMBED_MAX_BATCH_TOKENS: ${HLM_EMBED_MAX_BATCH_TOKENS:-1024}
      HLM_WORKER_BATCH_CHUNKS: ${HLM_WORKER_BATCH_CHUNKS:-32}
      HLM_WORKER_MAX_JOBS_PER_BATCH: ${HLM_WORKER_MAX_JOBS_PER_BATCH:-1}
    command: ["python", "/opt/hlmemo/worker_entrypoint.py"]
    volumes:
      - ./scripts/worker_entrypoint.py:/opt/hlmemo/worker_entrypoint.py:ro
      - ./scripts/worker_health.py:/opt/hlmemo/worker_health.py:ro
    mem_limit: 1536m
    cpus: 1.0
    stop_grace_period: 150s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/opt/hlmemo/worker_health.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # Librarian (PHASE2-4-ROADMAP §2/§6, W2a): same image, no ONNX model, no port, no /ready role.
  # R2: llm.env switches it (HLM_LIBRARIAN_ENABLED, HLM_LIBRARIAN_ROLE=observer; installed by
  # deploy/scripts/install_llm_env.sh). Without llm.env it idles with a heartbeat (default false).
  # The provider key lives in llm.env only, mounted here and into the api, never into
  # db/worker/migrate/caddy. llm.env is optional and sits next to app.env (common.sh sets
  # HLM_LLM_ENV_FILE); budget/role defaults in llm.env.example.
  librarian:
    <<: *app
    env_file:
      - path: ${HLM_APP_ENV_FILE:-./app.env}
        required: true
      - path: ${HLM_LLM_ENV_FILE:-./llm.env}
        required: false
    environment:
      <<: *app-environment
      HLM_LIBRARIAN_HEARTBEAT_FILE: /tmp/hlm-librarian-heartbeat.json
    command: ["python", "-m", "hlmemo.librarian.worker"]
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "hlmemo.librarian.health", "120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: ${HLM_CADDY_IMAGE:-caddy:2.11.2-alpine}
    environment:
      HLM_DOMAIN: ${HLM_DOMAIN:?Set HLM_DOMAIN in the env file}
      HLM_TLS_MODE: ${HLM_TLS_MODE:-acme}
    ports:
      - "${BAKE_BIND_IP:+${BAKE_BIND_IP}:}${BAKE_HTTP_PORT:-80}:80"
      - "${BAKE_BIND_IP:+${BAKE_BIND_IP}:}${BAKE_HTTPS_PORT:-443}:443"
      - "${BAKE_BIND_IP:+${BAKE_BIND_IP}:}${BAKE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend, outbound]
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  backend:
    internal: true
  frontend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.39.0/24
  outbound: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
