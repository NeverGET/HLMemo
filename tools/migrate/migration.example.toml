# migration.toml: the spec of ONE migration, for `hlm migrate <cmd> --spec migration.toml`.
# Same layout as docs/migration/templates/migration.toml. Copy it into the migration's private, gitignored directory
# (in the HLMemo repo: docs/private/migration/<slug>/). Relative paths resolve against this file's directory.
# See `hlmemo.migrate` for the safety rules.

# The target project. The operator creates it and grants the importing device `write` (TEMPLATE step 0).
slug = "my-project"

# Zone of date-only evidence (`date: 2026-07-19`) and of the month buckets. An IANA name, `UTC` or `local`.
tz = "Europe/Berlin"

# Optional: the body line that must accompany a `date-estimated` tag (the estimate's evidence: git commit or mtime).
# estimated_marker = "Date estimated"

[paths]
# The curated tree that `lint` checks: status/ (one fact per file), lessons/ (one lesson per file),
# sessions/ (dated episodes, `## YYYY-MM-DD …`, no preamble), decisions/ (D-rows, no preamble).
curated = "curated"
# seal.json and the run reports (runs/) land here. Keep it private.
private = "."
# Optional: the project's repository, so `path:line` pointers in bodies resolve to `describes` code refs.
# repo = "/path/to/the/project/repo"

# Optional. Without [[sources]], the import reads one markdown source: paths.curated.
# [[sources]]
# importer = "markdown"          # markdown | automemory | serena | context
# path = "curated"
# section_chars = 8000

[tags]
# The closed list of topic tags (one per line of work, area or component). Status tags (active, resolved,
# historical, date-estimated) are always allowed.
closed = ["api", "deploy", "data"]
# Optional: the allowed `<stack>@<version>` scope tags. Without it, any scope-shaped tag passes; with it, lint
# catches a typo such as `react-native@0.8x`.
# scopes = ["python@3.12", "postgres@17"]

# Optional. Side files next to the curated tree (a package's NOTES.md, a source list, a manifest) that are NOT part
# of the migration: lint, plan, seal and run all leave them out, so they are never imported. Globs, relative to
# paths.curated. Non-markdown files are ignored anyway.
# [lint]
# exclude = ["packages/**", "*/NOTES.md"]

# Optional: tools/migrate/scan.py (personal data and credentials).
# [scan]
# allow = ["email:status/support/contact.md:4"]   # accept one finding: "<rule>:<path>:<line>"
# allow_values = ["support@example.org"]           # accept a value wherever it occurs (a public address)
# [[scan.patterns]]                                 # project-specific rules (account ids, tax ids, ...)
# id = "account-id"
# regex = "\\bACC-[0-9]{8}\\b"
# mask = "<ACCOUNT>"

# The local scratch stack: tools/migrate/local_stack.sh up <slug> mints device mig-<slug> on port 8799.
[local]
server_url = "http://127.0.0.1:8799/mcp"
device = "mig-my-project"

# Production: only after the owner's OK on the review package, with a seal that passes `seal --verify`. A prod
# write (`run --apply`) also needs HLM_MIGRATE_ALLOW_PROD=1; a dry run, `verify` and `roundtrip` only read.
[prod]
server_url = "https://memory.example.org/mcp"
device = "my-device"
